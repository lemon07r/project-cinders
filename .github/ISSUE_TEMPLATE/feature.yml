name: Feature request
description: Suggest a setting, screen or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you'd use it.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Projector model (if relevant)
